{% extends "notes/base.html" %}
{% load static %}

{% block content %}
<div class="appbar">
  <a class="btn btn-secondary" href="{% url 'tags' %}">Voltar</a>
  <span class="subtitle">Notas com a tag: {{ tag.name }}</span>
</div>

<div class="container">
  <div class="card-container">
    {% for note in notes %}
    <div class="card">
      <div class="card-header">
        <p class="card-title">{{ note.title }}</p>
        <div class="card-actions">
          <a class="card-action-btn" href="{% url 'edit' note.id %}" aria-label="Editar {{ note.title }}" title="Editar">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z" />
            </svg>
          </a>
          <form method="post" action="{% url 'delete' note.id %}">
            {% csrf_token %}
            <button class="card-action-btn" type="submit" aria-label="Excluir {{ note.title }}" title="Excluir">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 6h18" />
                <path d="M8 6V4h8v2" />
                <path d="M19 6l-1 14H6L5 6" />
                <path d="M10 11v5M14 11v5" />
              </svg>
            </button>
          </form>
        </div>
      </div>
      <div class="card-content">
        <p>{{ note.content }}</p>
        <a class="tag" href="{% url 'tag_detail' tag.id %}">#{{ tag.name }}</a>
      </div>
    </div>
    {% empty %}
    <p>Nenhuma anotação possui esta tag.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
