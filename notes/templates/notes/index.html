{% extends "notes/base.html" %}
{% load static %}

{% block content %}
<div class="appbar">
  <img class="logo" src="{% static 'notes/img/logo-getit.png' %}" alt="Logo Get-it" />
  <span class="subtitle">Como o Post-it, mas com outro verbo</span>
</div>

<div class="container">
  <div class="form-card">
    <form method="post">
      {% csrf_token %}
      <input class="form-card-title" type="text" name="titulo" placeholder="Título" required />
      <textarea class="autoresize" name="detalhes" placeholder="Detalhes"></textarea>
      <button class="btn" type="submit">Adicionar Nota</button>
    </form>
  </div>

  <div class="card-container">
    {% for note in notes %}
    <div class="card">
      <div class="card-header">
        <p class="card-title">{{ note.title }}</p>
      </div>
      <div class="card-content">
        <p>{{ note.content }}</p>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
